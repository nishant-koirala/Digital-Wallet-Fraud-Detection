spring.application.name=wallet
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/wallet}
spring.datasource.username=${DB_USERNAME:wallet_app}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:default@example.com}
spring.mail.password=${MAIL_PASSWORD:defaultpass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
jwt.secret=${JWT_SECRET:my-super-secret-jwt-key-that-needs-to-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}