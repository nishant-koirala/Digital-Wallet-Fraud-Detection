spring.application.name=wallet
spring.datasource.url=jdbc:mysql://localhost:3308/wallet
spring.datasource.username=REDACTED_DB_USERNAME
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REDACTED_EMAIL
spring.mail.password=REDACTED_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
jwt.secret=REDACTED_JWT_SECRET
jwt.expiration=86400000