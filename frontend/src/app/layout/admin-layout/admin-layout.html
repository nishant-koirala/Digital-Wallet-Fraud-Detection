<div class="admin-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Admin Portal</h2>
      <span class="badge">ADMIN</span>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/admin/analytics" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="BarChart" class="icon"></lucide-icon> Analytics
      </a>
      <a routerLink="/admin/fraud-review" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="ShieldAlert" class="icon"></lucide-icon> Fraud Review
      </a>
      <a routerLink="/admin/fraud-settings" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="Settings" class="icon"></lucide-icon> Fraud Rules
      </a>
      <a routerLink="/admin/kyc-review" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="ClipboardCheck" class="icon"></lucide-icon> KYC Review
      </a>
      <a routerLink="/admin/merchants" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="Store" class="icon"></lucide-icon> Merchants
      </a>
      <a routerLink="/admin/audit-logs" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="FileSignature" class="icon"></lucide-icon> Audit Logs
      </a>
      <a routerLink="/admin/reports" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="Folder" class="icon"></lucide-icon> System Reports
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <lucide-icon [img]="LogOut" class="icon"></lucide-icon> Logout
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
