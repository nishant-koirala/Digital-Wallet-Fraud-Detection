<ng-container *ngIf="(authService.currentUser$ | async)?.role !== 'ADMIN'">
  <header class="top-bar">
    <div class="logo">Wallet App</div>
    <nav class="nav-links">
      <ng-container *ngIf="authService.currentUser$ | async as user; else unauthLinks">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
        <a routerLink="/qr" routerLinkActive="active">Send / Pay</a>
        <a routerLink="/merchant/onboard" routerLinkActive="active" *ngIf="user.role === 'USER'">Become a Merchant</a>
      </ng-container>
      <ng-template #unauthLinks>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </ng-template>
    </nav>

    <div class="user-profile" *ngIf="authService.currentUser$ | async as user">
      <div class="avatar">
        {{ user.name.charAt(0) }}
      </div>
      <span class="user-name">
        {{ user.name }}
        <span class="merchant-badge" *ngIf="user.role === 'MERCHANT'" title="Verified Merchant">✓</span>
      </span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </header>
</ng-container>
