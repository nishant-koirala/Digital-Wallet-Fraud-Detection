<div class="dashboard-container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem;">KYC Review Queue</h2>
      <p class="text-secondary" style="color: #64748b;">Review and approve user submitted identity documents.</p>
    </div>
  </div>

  <div *ngIf="documents.length === 0" class="solid-card" style="padding: 2rem; text-align: center; color: #64748b;">
    <p>No pending KYC applications found.</p>
  </div>

  <div class="kyc-grid mt-4">
    <div *ngFor="let doc of documents" class="kyc-card">
      <div class="doc-details">
        <strong>User ID:</strong> <span class="mono">{{ doc.userId }}</span><br>
        <strong>Type:</strong> {{ doc.documentType }}<br>
        <strong>Number:</strong> {{ doc.documentNumber }}<br>
        <strong>Submitted:</strong> {{ doc.createdAt | date:'short' }}
      </div>

      <div class="doc-images">
        <div class="img-container">
          <small>Front</small>
          <img [src]="doc.frontImageUrl" alt="Front" class="mock-img">
        </div>
        <div class="img-container">
          <small>Back</small>
          <img [src]="doc.backImageUrl" alt="Back" class="mock-img">
        </div>
      </div>

      <div class="doc-actions mt-3">
        <button class="btn btn-primary" (click)="approve(doc.id)">Approve</button>
        <button class="btn btn-outline" style="border: 1px solid var(--color-signal-red); color: var(--color-signal-red);" (click)="reject(doc.id)">Reject</button>
      </div>
    </div>
  </div>
</div>
