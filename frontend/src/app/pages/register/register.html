<div class="auth-container">
  <div class="auth-card">
    <div class="logo-container">
      <div class="logo">F</div>
    </div>
    <div class="auth-header">
      <h2>Create an Account</h2>
      <p>Join the Fonepay network today</p>
    </div>
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" [(ngModel)]="phone" name="phone" required>
      </div>
      <div class="form-group" *ngIf="!showOtp">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group" *ngIf="showOtp">
        <label>OTP Code</label>
        <input type="text" [(ngModel)]="otp" name="otp" required placeholder="Check your email">
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? (showOtp ? 'Verifying...' : 'Registering...') : (showOtp ? 'Verify & Register' : 'Register') }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Log In</a></p>
    </div>
  </div>
</div>
