<div class="auth-container">
  <div class="auth-card">
    <div class="logo-container">
      <div class="logo">F</div>
    </div>
    <div class="auth-header">
      <h2>Create an Account</h2>
      <p>Join the Fonepay network today</p>
    </div>
    <form (ngSubmit)="registerForm.form.valid && onSubmit()" #registerForm="ngForm" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" [(ngModel)]="name" name="name" required minlength="3" #nameInput="ngModel" [ngClass]="{'is-invalid': nameInput.invalid && (nameInput.dirty || nameInput.touched)}">
        <div class="error-text" *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)">
          Please enter your full name (min 3 characters).
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required email #emailInput="ngModel" [ngClass]="{'is-invalid': emailInput.invalid && (emailInput.dirty || emailInput.touched)}">
        <div class="error-text" *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
          Please enter a valid email address.
        </div>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="form-control" [(ngModel)]="phone" name="phone" required pattern="^[0-9]{10}$" #phoneInput="ngModel" [ngClass]="{'is-invalid': phoneInput.invalid && (phoneInput.dirty || phoneInput.touched)}">
        <div class="error-text" *ngIf="phoneInput.invalid && (phoneInput.dirty || phoneInput.touched)">
          Phone number must be exactly 10 digits.
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required minlength="8" #passwordInput="ngModel" [ngClass]="{'is-invalid': passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)}">
        <div class="error-text" *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
          Password must be at least 8 characters long.
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" [disabled]="loading || registerForm.invalid">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Log In</a></p>
    </div>
  </div>
</div>
