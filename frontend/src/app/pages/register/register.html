<div class="auth-container">
  <div class="auth-card">
    <div class="logo-container">
      <div class="logo">F</div>
    </div>
    <div class="auth-header">
      <h2>Create an Account</h2>
      <p>Join the Fonepay network today</p>
    </div>
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" [(ngModel)]="name" name="name" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="form-control" [(ngModel)]="phone" name="phone" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Log In</a></p>
    </div>
  </div>
</div>
