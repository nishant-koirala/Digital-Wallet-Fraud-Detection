<div class="qr-container">
  <div class="header">
    <h2>Receive via QR</h2>
    <a href="/" class="back-link text-slate">Back to Dashboard</a>
  </div>
  
  <div class="fonepay-qr-card">
    <div class="qr-card-header">
      <div class="brand">fonepay</div>
      <div class="subtitle">NEPAL'S PAYMENT NETWORK</div>
    </div>
    
    <div class="qr-card-body">
      <div class="scan-text">Scan to Pay</div>
      
      <div class="qr-placeholder" *ngIf="!myWalletId()">Loading...</div>
      
      <div class="qr-code-wrapper" *ngIf="myWalletId()">
        <qrcode [qrdata]="myWalletId()" [width]="220" [errorCorrectionLevel]="'M'"></qrcode>
      </div>
    </div>
    
    <div class="qr-card-footer">
      <div class="merchant-name">My Digital Wallet</div>
      <div class="wallet-id monospace" *ngIf="myWalletId()">{{ myWalletId() }}</div>
    </div>
  </div>
  
  <div class="upload-zone">
    <label for="qr-upload" class="upload-label text-medium">
      Scan or upload QR code to decode
    </label>
    <input type="file" id="qr-upload" accept="image/*" capture="environment" (change)="onFileSelected($event)" class="file-input">
    
  </div>
</div>
