<div class="auth-container">
  <div class="auth-card">
    <div class="logo-container">
      <div class="logo">F</div>
    </div>
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to your Fonepay wallet</p>
    </div>
    <form (ngSubmit)="loginForm.form.valid && onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required email #emailInput="ngModel" [ngClass]="{'is-invalid': emailInput.invalid && (emailInput.dirty || emailInput.touched)}">
        <div class="error-text" *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
          Please enter a valid email address.
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required #passwordInput="ngModel" [ngClass]="{'is-invalid': passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)}">
        <div class="error-text" *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
          Password is required.
        </div>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Logging in...' : 'Log In' }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>
  </div>
</div>
