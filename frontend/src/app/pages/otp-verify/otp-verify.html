<div class="auth-container">
  <div class="auth-card">
    <div class="logo-container">
      <div class="logo">F</div>
    </div>
    <div class="auth-header">
      <h2>{{ action === 'register' ? 'Verify Your Email' : 'Security Verification' }}</h2>
      <p>{{ action === 'register' ? 'We sent a 6-digit verification code to your email' : 'Enter the 6-digit OTP sent to your email' }}</p>
    </div>
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>{{ action === 'register' ? 'Verification Code' : 'OTP Code' }}</label>
        <input type="text" class="form-control" [(ngModel)]="otp" name="otp" required placeholder="000000">
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="loading || !otp">
        {{ loading ? 'Verifying...' : (action === 'register' ? 'Verify Email' : 'Verify OTP') }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Didn't receive it? <a routerLink="/login">Go back to login</a></p>
    </div>
  </div>
</div>
